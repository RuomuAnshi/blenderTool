name: Build and publish Blender plugin
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('character_effects/blender_manifest.toml').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Tag does not match plugin version')
          PY
      - name: Build installable extension
        run: python scripts/build_addon.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "角色特效与妆造 $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
